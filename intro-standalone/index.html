<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 저장된 테마를 첫 페인트 전에 적용 (본 사이트에서 다크로 켜뒀다면 그대로 따라감)
        (function () {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <title>JUNG / PARK / 亭朴</title>
</head>
<body class="is-loading">
    <div class="content">
        <span id="scroll-direct">Scroll &darr;</span>
    </div>

    <svg class="graphic-j">
        <path class="j-path"></path>
        <path class="u-path"></path>
        <path class="n-path"></path>
        <path class="g-path"></path>
    </svg>
    <svg class="graphic-park">
        <path class="p-path"></path>
        <path class="a-path"></path>
        <path class="r-path"></path>
        <path class="k-path"></path>
    </svg>
    <svg class="graphic-hanja">
        <path class="jung-path1"></path>
        <path class="jung-path2"></path>

        <path class="jung-path4"></path>
        <path class="jung-path5"></path>

        <path class="park-path1"></path>

        <path class="park-path5"></path>

        <circle class="hanja-dot"></circle>
    </svg>
</body>
<script src="./responsive.js"></script>
</html>
